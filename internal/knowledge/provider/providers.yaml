# Embedded provider recognition data. Changes take effect after rebuilding.
#
# cname matches CNAME suffixes at label boundaries. asn classifies addresses by origin AS.
# CDN, SaaS and shared-hosting ASNs are shared. Hyperscalers fail closed unless published
# ranges establish dedicated hosting. Range rules normally override ASN fallback;
# CDN origin ASNs remain shared even inside dedicated-provider ranges.
#
# Optional CNAME fields:
#   class: saas      skip sensitive-path checks on third-party platforms
#   class: cdn, waf  identify fronting providers for origin discovery
#   nxdomain: true   flag dangling chains into claimable resources
#   body: <RE2>      identify an unclaimed-resource response
# Static ranges also identify SaaS reached through apex A records.
#
# An alias of a name under an input root whose target is under no root and matches no cname entry
# is taken as a third party's platform (class saas), named by the target's registrable domain.
# A cloud platform that runs the target's own workloads therefore needs an entry with no class, or
# its hosts are neither port-checked nor asked for sensitive paths.
#
# txt matches case-insensitive root TXT prefixes for ownership verification. Output names the
# platform without exposing its token. A value no prefix matches that is shaped
# "<vendor>-domain-verification=" (or -site-, or neither) names the vendor as written. domains
# labels external DNS/mail/SaaS dependencies by suffix, or by a pattern (RE2) the registrable
# domain matches where a provider uses many domains: such a dependency is recorded once, by the
# provider. NS/MX lookups use registrable domains, so deeper entries cannot match those
# mechanisms. The Salesforce TXT prefix and the documented Squarespace/Wix ASN/range entries have
# not been rechecked against live data.
cname:
  - {suffix: cloudfront.net, provider: aws, service: CloudFront, class: cdn}
