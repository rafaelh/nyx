  - {suffix: cloudfront.net, provider: aws, service: CloudFront, class: cdn}
  - {suffix: elb.amazonaws.com, provider: aws, service: ELB}
  - {suffix: s3.amazonaws.com, provider: aws, service: S3, body: 'NoSuchBucket'}
