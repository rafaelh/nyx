version: "2"

linters:
  enable:
    # Limit nesting-heavy functions, which are harder to follow than flat branches.
    - gocognit
    # Catch error checks that fail when errors are wrapped.
    - errorlint
    # Catch missing enum cases unless a default handles them.
    - exhaustive
    # Keep environment access and output routed through injected dependencies.
    - forbidigo
    # Use Australian spelling in prose.
    - misspell
    # Run top-level tests in parallel; shared fixtures may require ordered subtests.
    - paralleltest
    # Report helper failures at their calling test.
    - thelper
    # Require specific, explained lint suppressions.
    - nolintlint
    # Explicit JSON tags prevent Go field renames from silently changing stored/API keys.
    - musttag
    # Explain nil returns after errors, including negative results that intentionally complete checks.
    - nilerr
    # Catch local mistakes and unnecessary code.
    - copyloopvar
    - gocritic
    - intrange
    - modernize
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    gocognit:
      min-complexity: 30
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      # Also catch impossible nil conditions and unused field writes, often caused by copying structs.
      enable: [nilness, unusedwrite]
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: read the environment through config.Env (cli.Deps.Env), so each test can give a run its own
        - pattern: ^(os\.(Setenv|Unsetenv)|\(\*testing\.T\)\.Setenv)$
          msg: set a variable with the harness's h.setenv; Go forbids t.Setenv in a parallel test
        - pattern: ^(viper\.AutomaticEnv|\(\*github\.com/spf13/viper\.Viper\)\.AutomaticEnv)$
          msg: no setting is read from the environment; the config file is the only source
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to the command's writer; only cli.Execute writes errors and picks the exit code
    misspell:
      locale: UK
      ignore-rules:
        # Preserve external API/package names and established colour conventions.
        - sanitize
        - color
        - analyzed
        - center
    nolintlint:
      require-explanation: true
      require-specific: true
    paralleltest:
      ignore-missing-subtests: true
  exclusions:
    # Allow conventional ignored errors such as deferred Close calls.
    presets:
      - std-error-handling
    rules:
      # Subprocess tests need the real process environment when launching children.
      - path: internal/(cli/(crash_test|setup_child_test|pty_linux_test)|egress/boundary_test)\.go
        linters: [forbidigo]
      # Test callbacks are assertions' origin; marking them helpers would blame the calling loop.
      - linters: [thelper]
        source: ^func test[A-Z]\w*\(t \*testing\.T\)|[,(]\s*func\(t \*testing\.T
